<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tiêu đề và Mô tả hiển thị khi chia sẻ lên mạng xã hội (Zalo, Facebook, v.v.) -->
    <title>Hệ thống Quản lý Tiến độ Ngầm hóa QLDA</title>
    <meta name="description" content="Trang chủ hệ thống quản lý và giám sát dự án ngầm hóa cáp viễn thông">
    
    <!-- Open Graph / Facebook / Zalo Metadata -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Hệ thống Quản lý Tiến độ Ngầm hóa">
    <meta property="og:description" content="Trang chủ hệ thống quản lý và giám sát dự án ngầm hóa cáp viễn thông">
    <meta property="og:image" content="URL_LOGO_HOẶC_ẢNH_ĐẠI_DIỆN_CỦA_BẠN">
    <meta property="og:url" content="URL_TRANG_WEB_HIỆN_TẠI_CỦA_BẠN">

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Hệ thống Quản lý Tiến độ Ngầm hóa QLDA">
    <meta name="twitter:description" content="Trang chủ hệ thống quản lý và giám sát dự án ngầm hóa cáp viễn thông">
    <meta name="twitter:image" content="URL_LOGO_HOẶC_ẢNH_ĐẠI_DIỆN_CỦA_BẠN">

    <!-- Thẻ meta refresh dự phòng (mặc định 0 giây) -->
    <meta id="meta-refresh" http-equiv="refresh" content="0;url=">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="spinner"></div>
    <h1>Đang tải hệ thống quản lý tiến độ ngầm hóa</h1>
    <p>Vui lòng đợi trong giây lát...</p>
    <a href="#" id="redirect-link" class="btn">Truy cập ngay</a>
</div>

<script>
    // ==========================================
    // CHỈ CẦN THAY ĐỔI LINK Ở BIẾN NÀY SAU NÀY
    // ==========================================
    const TARGET_URL = "https://script.google.com/macros/s/AKfycbxxrxPOtMm_TUj_SB398zYfiOPU9Zkopo_QX9zdt34pclRt7fB74KUhvf4V-C6ANV6gIQ/exec";

    // Tự động gán link vào nút bấm
    document.getElementById("redirect-link").href = TARGET_URL;

    // Tự động gán link vào thẻ meta refresh
    document.getElementById("meta-refresh").content = "0;url=" + TARGET_URL;
    
    // Thực hiện chuyển hướng ngay lập tức
    window.location.replace(TARGET_URL);
</script>

</body>
</html>
